version: 1
name: agentenv-candidate
kind: agentenv
template: pydantic-multiturn-eval-candidate-v1
credentials:
  api_url_env: E2B_API_URL
  sandbox_url_env: E2B_SANDBOX_URL
  api_key_env: E2B_API_KEY
guest_env:
  - ZAI_API_KEY
turn:
  argv: [python, /opt/multiturn/agentenv_turn.py]
  cwd: /workspace
verifier:
  argv: [python, /opt/multiturn/agentenv_verify.py]
  cwd: /workspace
limits:
  sandbox_ttl_seconds: 900
