name: Harbor integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11 3.13
      - run: uv sync --locked --all-extras
      - run: uv tool install --python 3.13 harbor==0.1.44
      - run: make verify-harbor
      - run: >-
          uv run python -m scripts.verify_harbor_multiturn
          --directory outputs/harbor-multiturn/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-multiturn-results
          path: outputs/harbor-multiturn/
          if-no-files-found: warn
