[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "pydantic-multiturn-evals"
version = "0.2.0"
description = "Harness-agnostic multi-turn evaluation with durable evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "pydantic-ai-slim[anthropic,openai]==2.42.0",
]

[project.optional-dependencies]
agentenv = ["e2b==2.46.4"]
tracing = ["langfuse>=4.12,<5"]

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
]

[project.scripts]
multiturn-evals = "pydantic_multiturn_evals.cli:main"

[tool.uv.build-backend]
module-name = "pydantic_multiturn_evals"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pydantic_multiturn_evals"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests", "examples", "scripts"]
venvPath = "."
venv = ".venv"
